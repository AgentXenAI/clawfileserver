<div id="xmg"></div>
<style>
#xmg{font-family:var(--font-body);color:var(--text)}
#xmg .bar{display:flex;align-items:center;gap:10px;margin-bottom:8px}
#xmg .rf{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font:inherit;font-size:12px;padding:4px 12px;cursor:pointer}
#xmg .rf:hover{border-color:var(--accent)}
#xmg .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
#xmg .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;cursor:pointer}
#xmg .ph{aspect-ratio:16/10;background:var(--muted,#222);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:20px}
#xmg img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
#xmg .cap{padding:6px 8px;display:flex;flex-direction:column;gap:2px;min-width:0}
#xmg .nm{font-family:var(--font-mono);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#xmg .meta{font-size:10px;color:var(--muted)}
#xmg a.lnk{font-size:10px;color:var(--accent);text-decoration:none}
#xmg a.lnk:hover{text-decoration:underline}
#xmg a.full{font-family:var(--font-mono);font-size:11px;color:var(--accent);word-break:break-all}
#xmg .foot{margin-top:8px;font-size:10px;color:var(--muted)}
#xmg .det{display:flex;flex-direction:column;gap:8px}
#xmg .det img{width:100%;height:auto;max-height:60vh;aspect-ratio:auto;object-fit:contain;border-radius:var(--radius);background:#000}
#xmg .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#xmg .back{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font:inherit;font-size:12px;padding:4px 10px;cursor:pointer}
#xmg .back.top{background:var(--accent);border-color:var(--accent);color:#fff;font-size:13px;font-weight:600;padding:7px 14px;align-self:flex-start}
#xmg input.url{flex:1;min-width:0;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:var(--font-mono);font-size:10px;padding:5px 8px}
</style>
<script>
(function(){
var BASE="__BASE__",TOKEN="__TOKEN__",DIR="__DIR__",MAX=parseInt("__MAX__",10)||12,BP="__BASEPATH__";
if(!BASE||BASE==="__BASE__")BASE="auto";
if(!BP||BP==="__BASEPATH__")BP="clawfileserver";
BP=BP.replace(/^\/+/,"").replace(/\/+$/,"");
// BASE="auto" (default): serve from the same domain as the Control UI, under the
// plugin basePath. The widget sandbox runs on its own origin, so build absolute
// URLs from the host-provided Control UI origin (available shortly after init).
function resolveBase(){
  if(BASE!=="auto")return BASE.replace(/\/+$/,"");
  var o=window.openclaw&&window.openclaw.host&&window.openclaw.host.controlUiBaseUrl;
  if(!o)return null;
  try{return new URL(o,location.href).origin+(BP?"/"+BP:"");}catch(_){return null;}
}
var IMG_RE=/\.(png|jpe?g|webp|gif)$/i;
// Link-out modes: the OpenClaw Android app runs in a WebView (UA contains
// "; wv)") where new-tab links silently fail — use the copy-URL fallback there.
// Real browsers, including mobile Chrome/Safari, let the Control UI host forward
// target="_blank" clicks to a new tab, so show a normal link. Do NOT match on
// bare "Android": mobile browsers are web too.
var ANDROID=/; wv\)/.test(navigator.userAgent)||/OpenClaw/i.test(navigator.userAgent);
var DIRP=DIR.split('/').map(encodeURIComponent).join('/');
var root=document.getElementById('xmg');
var shots={};
function rawUrl(n){return resolveBase()+DIRP+'/'+encodeURIComponent(n)+'?raw=1&t='+TOKEN;}
function pageUrl(n){return resolveBase()+DIRP+'/'+encodeURIComponent(n)+'?t='+TOKEN;}
function toDataURL(b){return new Promise(function(ok,no){var fr=new FileReader();fr.onload=function(){ok(fr.result);};fr.onerror=no;fr.readAsDataURL(b);});}
function fmtDate(ms){return ms?new Date(ms).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'?';}
function fmtKB(b){return b==null?'?':Math.round(b/1024)+' KB';}
function detail(it){
  root.innerHTML='';
  var d=document.createElement('div');d.className='det';
  var img=document.createElement('img');img.alt=it.name;
  if(shots[it.name]){img.src=shots[it.name];}else{img.remove();}
  var row=document.createElement('div');row.className='row';
  var b=document.createElement('button');b.className='back top';b.textContent='\u2190 Back to gallery';
  b.addEventListener('click',function(){grid(items,total);});
  var url=pageUrl(it.name);
  var nm=document.createElement('div');nm.className='nm';nm.textContent=it.name+' \u00b7 '+fmtDate(it.mtime)+' \u00b7 '+fmtKB(it.size);
  if(ANDROID){
  var inp=document.createElement('input');inp.className='url';inp.readOnly=true;inp.value=url;
  inp.addEventListener('click',function(){inp.select();});
  var cp=document.createElement('button');cp.className='back';cp.textContent='copy URL';
  cp.addEventListener('click',function(){
    function legacy(){try{var t=document.createElement('textarea');t.value=url;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.focus();t.select();var ok=document.execCommand('copy');t.remove();return ok;}catch(_){return false;}}
    function done(ok){cp.textContent=ok?'copied \u2713':'copy failed';setTimeout(function(){cp.textContent='copy URL';},1500);}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(function(){done(true);},function(){done(legacy());});}
    else{done(legacy());}
  });
  row.appendChild(inp);row.appendChild(cp);
  d.appendChild(b);d.appendChild(img);d.appendChild(nm);d.appendChild(row);
  var tip=document.createElement('div');tip.className='foot';
  tip.textContent='copy URL puts the link on your clipboard \u2014 paste in a browser tab to open it';
  d.appendChild(tip);
  }else{
  var lk=document.createElement('a');lk.className='full';lk.href=url;lk.target='_blank';lk.rel='noopener';lk.textContent=url;
  d.appendChild(b);d.appendChild(img);d.appendChild(nm);d.appendChild(lk);
  }
  root.appendChild(d);
  if(!shots[it.name]){
    fetch(rawUrl(it.name)).then(function(r){if(!r.ok)throw 0;return r.blob();}).then(toDataURL)
      .then(function(u){shots[it.name]=u;detail(it);}).catch(function(){});
  }
}
var items=[],total=0;
function grid(list,tot){
  items=list;total=tot;
  root.innerHTML='';
  var bar=document.createElement('div');bar.className='bar';
  var rf=document.createElement('button');rf.className='rf';rf.textContent='\u21bb refresh';
  rf.addEventListener('click',refresh);
  bar.appendChild(rf);root.appendChild(bar);
  if(!list.length){
    var em=document.createElement('div');em.className='foot';em.textContent='no images found in '+DIR;
    root.appendChild(em);return;
  }
  var g=document.createElement('div');g.className='grid';
  list.forEach(function(it){
    var card=document.createElement('div');card.className='card';
    var ph=document.createElement('div');ph.className='ph';ph.textContent='\u23f3';
    card.appendChild(ph);
    var cap=document.createElement('div');cap.className='cap';
    var nm=document.createElement('div');nm.className='nm';nm.textContent=it.name;nm.title=it.name;
    var meta=document.createElement('div');meta.className='meta';meta.textContent=fmtDate(it.mtime)+' \u00b7 '+fmtKB(it.size);
    var a=document.createElement('a');a.className='lnk';a.textContent='open \u2197';
    a.href=pageUrl(it.name);a.target='_blank';a.rel='noopener';
    a.addEventListener('click',function(e){e.stopPropagation();if(ANDROID){e.preventDefault();detail(it);}});
    cap.appendChild(nm);cap.appendChild(meta);cap.appendChild(a);
    card.appendChild(cap);
    card.addEventListener('click',function(){detail(it);});
    g.appendChild(card);
    if(shots[it.name]){
      var im=document.createElement('img');im.alt=it.name;im.src=shots[it.name];card.replaceChild(im,ph);
    }else{
      fetch(rawUrl(it.name)).then(function(r){if(!r.ok)throw new Error(String(r.status));return r.blob();}).then(toDataURL)
        .then(function(u){shots[it.name]=u;var im2=document.createElement('img');im2.alt=it.name;im2.src=u;card.replaceChild(im2,ph);})
        .catch(function(){ph.textContent='\ud83d\udcf7';ph.title='preview unavailable \u2014 tap for link';});
    }
  });
  root.appendChild(g);
  var foot=document.createElement('div');foot.className='foot';
  foot.textContent='showing '+list.length+' of '+tot+' images in '+DIR+' \u00b7 listings and previews fetched live \u00b7 tap a card for the link';
  root.appendChild(foot);
}
function refresh(){
  var b=resolveBase();
  if(!b){
    if((refresh.tries=(refresh.tries||0)+1)<40){
      root.innerHTML='<div class="foot">loading\u2026</div>';
      setTimeout(refresh,250);return;
    }
    fail('could not detect the Control UI origin \u2014 set BASE to an explicit URL');
    return;
  }
  root.innerHTML='<div class="foot">loading\u2026</div>';
  fetch(b+DIRP+'/?json=1&t='+TOKEN).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status+(r.status===401?' (bad or missing token)':''));
    return r.json();
  }).then(function(j){
    var all=(j.entries||[]).filter(function(e){return !e.dir&&IMG_RE.test(e.name);});
    all.sort(function(a,b){return (b.mtime||0)-(a.mtime||0);});
    grid(all.slice(0,MAX),all.length);
  }).catch(function(e){fail('gallery unavailable: '+e.message+' \u2014 check the share token and network, then retry');});
}
function fail(msg){
  root.innerHTML='';
  var bar=document.createElement('div');bar.className='bar';
  var rf=document.createElement('button');rf.className='rf';rf.textContent='\u21bb retry';
  rf.addEventListener('click',refresh);bar.appendChild(rf);root.appendChild(bar);
  var er=document.createElement('div');er.className='foot';er.textContent=msg;
  root.appendChild(er);
}
refresh();
})();
</script>
