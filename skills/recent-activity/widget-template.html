<div id="xrec">
<style>
#xrec{font-family:var(--font-body);color:var(--text)}
#xrec .bar{display:flex;align-items:center;gap:10px;margin-bottom:8px;color:var(--muted);font-size:.78em}
#xrec .bar b{color:var(--text)}
#xrec .list{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;max-height:420px;overflow-y:auto}
#xrec .row{display:flex;align-items:baseline;gap:8px;padding:6px 10px;border-bottom:1px solid var(--border);background:var(--card);font-size:.85em;min-width:0}
#xrec .row:last-child{border-bottom:none}
#xrec .row .ic{flex:none}
#xrec .row a{color:var(--text);text-decoration:none;overflow-wrap:anywhere;min-width:0}
#xrec .row a:hover{color:var(--accent,#38BDF8)}
#xrec .row .age{margin-left:auto;flex:none;color:var(--muted);font-family:var(--font-mono);font-size:.85em}
#xrec .row .sz{flex:none;color:var(--muted);font-family:var(--font-mono);font-size:.85em;min-width:52px;text-align:right}
#xrec .row .root{flex:none;color:var(--muted);font-size:.8em;border:1px solid var(--border);border-radius:4px;padding:0 5px}
#xrec .empty{padding:16px;color:var(--muted);text-align:center}
#xrec .err{padding:16px;color:var(--danger,#e57)}
</style>
<div class="bar"><span>last <b id="xrec-h">24h</b> · <span id="xrec-n"></span></span><span id="xrec-st" style="margin-left:auto"></span></div>
<div class="list" id="xrec-list"><div class="empty">loading…</div></div>
<script>
(function(){
var BASE="__BASE__",TOKEN="__TOKEN__",HOURS=parseFloat("__HOURS__")||24,MAX=parseInt("__MAX__",10)||60,BP="__BASEPATH__";
if(!BASE||BASE==="__BASE__")BASE="auto";
if(!BP||BP==="__BASEPATH__")BP="clawfileserver";
BP=BP.replace(/^\/+/,"").replace(/\/+$/,"");
// BASE="auto": resolve the Control UI origin at runtime (widget sandbox is its own origin).
function resolveBase(){
  if(BASE!=="auto")return BASE.replace(/\/+$/,"");
  var o=window.openclaw&&window.openclaw.host&&window.openclaw.host.controlUiBaseUrl;
  if(!o)return null;
  try{return new URL(o,location.href).origin+(BP?"/"+BP:"");}catch(_){return null;}
}
document.getElementById("xrec-h").textContent=HOURS>=48?Math.round(HOURS/24)+"d":HOURS>=36?Math.round(HOURS/24)+"d":Math.round(HOURS)+"h";
function age(ms){var s=(Date.now()-ms)/1000;if(s<60)return Math.max(1,Math.round(s))+"m";if(s<3600)return Math.round(s/60)+"m";if(s<86400)return Math.round(s/3600)+"h";return Math.round(s/86400)+"d";}
function sz(b){if(b==null)return"";if(b<1024)return b+" B";if(b<1048576)return(b/1024).toFixed(1)+" K";if(b<1073741824)return(b/1048576).toFixed(1)+" M";return(b/1073741824).toFixed(2)+" G";}
function icon(it){if(it.dir)return"📁";var m=/\.(png|jpe?g|webp|gif)$/i.test(it.name);if(m)return"🖼";if(/\.(md|txt|log|json|ya?ml|js|mjs|ts|py|sh)$/i.test(it.name))return"📝";return"📄";}
function enc(p){return p.split("/").filter(Boolean).map(encodeURIComponent).join("/");}
function refresh(){
  var b=resolveBase(),st=document.getElementById("xrec-st");
  if(!b){st.textContent="waiting for host…";setTimeout(refresh,1000);return;}
  st.textContent="";
  fetch(b+"/_recent?hours="+HOURS+"&max="+MAX+"&t="+encodeURIComponent(TOKEN))
  .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
  .then(function(j){
    var el=document.getElementById("xrec-list");
    document.getElementById("xrec-n").textContent=(j.count||0)+" changed"+(j.truncated?" (scan capped)":"");
    if(!j.items||!j.items.length){el.innerHTML='<div class="empty">quiet — nothing changed</div>';return;}
    el.innerHTML=j.items.map(function(it){
      var href=b+"/"+enc(it.path)+(it.dir?"/":"")+"?t="+encodeURIComponent(TOKEN);
      return '<div class="row"><span class="ic">'+icon(it)+'</span><a href="'+href+'" target="_blank" rel="noopener">'+it.rel.replace(/&/g,"&amp;").replace(/</g,"&lt;")+'</a><span class="sz">'+sz(it.size)+'</span><span class="age">'+age(it.mtime)+'</span></div>';
    }).join("");
    setTimeout(refresh,60000);
  })
  .catch(function(e){document.getElementById("xrec-list").innerHTML='<div class="err">fetch failed: '+e.message+'</div>';setTimeout(refresh,30000);});
}
refresh();
})();
</script>
</div>
