<style>
  /* All selectors scoped under #ra-root with ra- prefixed classes: the dashboard
     host injects its own stylesheet into the widget document, and generic names
     like .row/.head/.feed collide with it (caused wrapped timestamps and
     single-character names on 2026-11-09). The gallery scopes the same way. */
  #ra-root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: transparent; color: #e0e0e0; padding: 14px; }
  #ra-root * { box-sizing: border-box; margin: 0; padding: 0; }
  #ra-root .ra-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  #ra-root .ra-head h1 { font-size: 15px; font-weight: 600; color: #fff; }
  #ra-root .ra-meta { font-size: 11px; color: #888; }
  #ra-root .ra-controls { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
  #ra-root .ra-controls select { background: #2a2a33; color: #ddd; border: 1px solid #3a3a44; border-radius: 6px; padding: 4px 8px; font-size: 12px; }
  #ra-root .ra-controls label { font-size: 11px; color: #999; }
  #ra-root .ra-stats { display: flex; gap: 14px; margin-bottom: 12px; flex-wrap: wrap; }
  #ra-root .ra-stat { background: #22222b; border: 1px solid #33333d; border-radius: 10px; padding: 8px 14px; min-width: 84px; }
  #ra-root .ra-stat b { display: block; font-size: 18px; color: #fff; }
  #ra-root .ra-stat span { font-size: 10px; color: #8a8a95; text-transform: uppercase; letter-spacing: .5px; }
  #ra-root .ra-feed { display: flex; flex-direction: column; gap: 2px; }
  #ra-root .ra-row { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; text-decoration: none; color: inherit; flex-wrap: nowrap; }
  #ra-root .ra-row:hover { background: #26262e; }
  #ra-root .ra-ico { width: 30px; height: 30px; border-radius: 7px; background: #2a2a33; display: flex; align-items: center; justify-content: center; font-size: 15px; flex: 0 0 30px; }
  #ra-root .ra-name { font-size: 13px; color: #eee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; min-width: 3ch; }
  #ra-root .ra-path { font-size: 10px; color: #777; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0; max-width: 45%; }
  #ra-root .ra-when { font-size: 11px; color: #8ab4f8; flex: 0 0 auto; font-variant-numeric: tabular-nums; }
  #ra-root .ra-sz { font-size: 10px; color: #666; flex: 0 0 60px; text-align: right; }
  #ra-root .ra-empty { text-align: center; color: #777; padding: 30px 0; font-size: 13px; }
  #ra-root .ra-err { text-align: center; color: #f88; padding: 20px 0; font-size: 12px; }
  @media (max-width: 560px) {
    #ra-root .ra-path { display: none; }
    #ra-root .ra-sz { flex-basis: 50px; }
  }
</style>
<div id="ra-root">
<div class="ra-head">
  <h1>Recent activity</h1>
  <div class="ra-meta" id="meta">loading…</div>
</div>
<div class="ra-controls">
  <label>Window
    <select id="hours">
      <option value="1">Last hour</option>
      <option value="6">Last 6h</option>
      <option value="24" selected>Last 24h</option>
      <option value="72">Last 3 days</option>
      <option value="168">Last week</option>
    </select>
  </label>
  <label>Root
    <select id="root"><option value="">All roots</option></select>
  </label>
</div>
<div class="ra-stats" id="stats"></div>
<div class="ra-feed" id="feed"></div>
</div>
<script>
(async () => {
  let BASE = "__BASE__";
  const TOKEN = "__TOKEN__";
  let BP = "__BASEPATH__";
  // Lazy resolution: controlUiBaseUrl can stay null until the dashboard finishes
  // initializing, so try on every refresh instead of giving up at load (the
  // gallery works for the same reason). Returns true once BASE is concrete.
  function tryResolve() {
    if (BASE !== "auto") return true;
    let host = null;
    try { host = window.openclaw && window.openclaw.host; } catch (e) {}
    const base = host && (host.controlUiBaseUrl || host.orchestrationBaseUrl);
    if (typeof base !== "string" || !/^https?:\/\//.test(base)) return false;
    const u = new URL(base);
    BASE = u.origin;
    const m = u.pathname.match(/^(.*?)\/api\/control\/ui\/?$/);
    if (m && m[1]) BP = m[1].replace(/^\//, "") + "/" + BP;
    return true;
  }
  const url = (p) => BASE + "/" + BP + "/" + p + (TOKEN ? (TOKEN.startsWith("basic:") ? "?" : (p.includes("?") ? "&" : "?") + "t=" + encodeURIComponent(TOKEN)) : "");
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const ICONS = {
    png: "🖼️", jpg: "🖼️", jpeg: "🖼️", gif: "🖼️", webp: "🖼️", svg: "🖼️", heic: "🖼️",
    mp4: "🎬", mov: "🎬", mkv: "🎬", webm: "🎬",
    mp3: "🎵", wav: "🎵", m4a: "🎵", flac: "🎵", ogg: "🎵",
    pdf: "📕", zip: "🗜️", tar: "🗜️", gz: "🗜️",
    md: "📝", txt: "📝", log: "📝", json: "🧩", yml: "🧩", yaml: "🧩",
    js: "📜", ts: "📜", py: "📜", sh: "📜", html: "📜", css: "📜",
  };
  const ico = (f) => f.dir ? "📁" : (ICONS[(f.name.split(".").pop() || "").toLowerCase()] || "📄");
  const fmtSize = (n) => n >= 1048576 ? (n / 1048576).toFixed(1) + " MB" : n >= 1024 ? (n / 1024).toFixed(0) + " KB" : n + " B";
  const fmtWhen = (ms) => {
    const s = (Date.now() - ms) / 1000;
    if (s < 90) return "just now";
    if (s < 5400) return Math.round(s / 60) + "m ago";
    if (s < 86400) return Math.round(s / 3600) + "h ago";
    return Math.round(s / 86400) + "d ago";
  };

  // root selector gets populated from the first "All roots" feed (files carry .root)
  let rootsPopulated = false;
  async function refresh() {
    const hours = $("hours").value;
    const root = $("root").value;
    $("meta").textContent = "loading…";
    if (!tryResolve()) {
      $("meta").textContent = "waiting…";
      $("feed").innerHTML = '<div class="ra-empty">Waiting for dashboard to finish initializing…</div>';
      if (!window.__raRetryPending) {
        window.__raRetryPending = true;
        setTimeout(() => { window.__raRetryPending = false; refresh(); }, 1500);
      }
      return;
    }
    try {
      const r = await fetch(url("_recent?hours=" + hours + "&max=200" + (root ? "&root=" + encodeURIComponent(root) : "")));
      if (!r.ok) throw new Error("HTTP " + r.status);
      const j = await r.json();
      const files = j.items || [];
      if (!rootsPopulated && !root) {
        rootsPopulated = true;
        const paths = [...new Set(files.map(f => f.root))];
        if (paths.length > 1) {
          $("root").innerHTML = '<option value="">All roots</option>' +
            paths.map(pth => `<option value="${esc(pth)}">${esc(pth.split("/").filter(Boolean).pop() || pth)}</option>`).join("");
        }
      }
      const nFiles = files.filter(f => !f.dir).length;
      const bytes = files.reduce((a, f) => a + (f.dir ? 0 : f.size), 0);
      $("stats").innerHTML =
        `<div class="ra-stat"><b>${nFiles}</b><span>files</span></div>` +
        `<div class="ra-stat"><b>${files.length - nFiles}</b><span>folders</span></div>` +
        `<div class="ra-stat"><b>${fmtSize(bytes)}</b><span>touched</span></div>`;
      $("meta").textContent = `${j.scanned} scanned` + (j.now ? ` · ${new Date(j.now).toLocaleTimeString()}` : "");
      if (!files.length) {
        $("feed").innerHTML = '<div class="ra-empty">Nothing modified in this window.</div>';
        return;
      }
      $("feed").innerHTML = files.map(f => {
        const href = url(f.path.split("/").filter(Boolean).map(encodeURIComponent).join("/"));
        return `<a class="ra-row" href="${href}" target="_blank" rel="noopener noreferrer" title="${esc(f.path)}">
          <div class="ra-ico">${ico(f)}</div>
          <div class="ra-name">${esc(f.name)}</div>
          <div class="ra-path">${esc(f.rel.includes("/") ? f.rel : "")}</div>
          <div class="ra-sz">${f.dir ? "" : fmtSize(f.size)}</div>
          <div class="ra-when">${fmtWhen(f.mtime)}</div>
        </a>`;
      }).join("");
    } catch (e) {
      $("meta").textContent = "error";
      $("feed").innerHTML = '<div class="ra-err">Failed to load: ' + esc(e.message) + '</div>';
    }
  }
  $("hours").addEventListener("change", refresh);
  $("root").addEventListener("change", refresh);
  await refresh();
  setInterval(refresh, 60000);
})();
</script>
